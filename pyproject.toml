[project]
name = "seo-security-suite"
version = "2.0.0"
description = "All-in-One Website Audit, SEO, Security, Performance & UI Diagnostic Suite"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.2.0",
    "certifi>=2024.2.2",
    "openpyxl>=3.1.2",
    "reportlab>=4.2.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
]

[tool.vercel]
entrypoint = "main:app"
